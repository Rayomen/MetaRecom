<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MetaRecom — Intelligent Model Recommender{% endblock %}</title>
  <meta name="description" content="MetaRecom uses meta-learning to recommend the best machine learning model for any tabular dataset." />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  <!-- Plotly only loaded on results page via extra_head block -->
  {% block extra_head %}{% endblock %}
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

</head>
<body>
  <header class="site-header">
    <a href="{{ url_for('landing') }}" class="brand">
      <span class="brand-mark">🧠</span>
      <span class="brand-text">MetaRecom</span>
    </a>

    <nav class="site-nav">
      <a href="{{ url_for('landing') }}"     class="{% if active=='home'    %}active{% endif %}">Home</a>
      <a href="{{ url_for('app_page') }}"    class="{% if active=='app'     %}active{% endif %}">Try it</a>
      <a href="{{ url_for('history_page') }}" class="{% if active=='history' %}active{% endif %}">History</a>
    </nav>

    <div class="theme-switcher" role="group" aria-label="Theme">
      <button type="button" data-theme-set="dark"     title="Dark theme">🌙</button>
      <button type="button" data-theme-set="light"    title="Light theme">☀️</button>
      <button type="button" data-theme-set="gradient" title="Gradient theme">🎨</button>
    </div>
  </header>

  {% if error %}
    <div class="alert alert-error container">{{ error }}</div>
  {% endif %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <span>MetaRecom · Intelligent Model Recommendation via Meta-Learning</span>
      <span class="muted">Final Year Major Project</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
